<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Document</title>

<style>

/*
  #  = id
  . = class
  : = pseudo class
  :: = pseudo element
   >  = children

*/

a {color: red;
text-decoration: none;}

a :visited {color: rgba(132, 0, 255, 0.226);}
a:hover {text-decoration: underline;
color: black;}
a:active {color: yellow;}

a::before {content: '😏';}
a::after {content: '😏';}


</style>


</head>
<body>
    
    <h1>pseudo classes</h1>

    <ul>
        
    <a href="https://www.youtube.com/" target="_blank"><li>f</li></a>
            
    <a href="https://www.youtube.com/" target="_blank"><li>f</li></a>
        
    <a href="https://www.youtube.com/" target="_blank"><li>f</li></a>
   
    
    
    </ul>
</body>
</html>
