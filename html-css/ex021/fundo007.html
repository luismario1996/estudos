<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>centralização vertical</title>

<style>

    * {margin: 0;}
#container {background-color: purple;
position: relative;
background-image: url(/html-css/ex021/imagens/target001.png);
background-size: 100% 100%;
background-repeat: no-repeat;
height: 500px;}

#conteudo {background-color: yellow;
height: 200px;
width: 400px;
position: absolute;
top: 50%;
left:50%;


transform: translate(-50%,-50%);

}
</style> 
</head>
<body>


    <section id="container">
<article id="conteudo">


</article>

    </section>
    
</body>
</html>
