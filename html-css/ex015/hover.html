<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de hover</title>
<style>


    div:hover{color: red;}

    div > p {
 display: none;}

 div:hover > p {
 color: white;
 background-color: red;
 width: 300px;}
</style>

</head>
<body>
    <h1>exemplo de hover</h1>

    <p>passe o mouse no texto abaixo</p>

    <div>passe o mouse aqui

        <p>texto escondido</p>
    </div>
</body>
</html>
