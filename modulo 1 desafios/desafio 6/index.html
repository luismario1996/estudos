<body>
    <h1>Desafio das Tags</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual taq deverá utilizar em cada caso.</p>


    <ul>
        <li> <abbr title=" Use a Tag &lt;P&gt; &lt;/p&gt;">Parágrafos</abbr></li>
        <li><abbr title="Tag de &lt;h1&gt; &lt;/h1&gt;">Títulos</abbr></li>
        <li> <abbr title="Use a Tag &lt;img src=&ldquo; caminho &rdquo; &gt;">Imagens</abbr></li>
        <li> <abbr title="Use a Tag &lt;abbr title &ldquo;  &ldquo; &gt; &lt;/abbr&gt;">Abreviações</abbr></li>
        <li> <abbr title="Use a Tag &lt;prev&gt; &lt;code&gt; &lt;/code&gt;   &lt;/prev&gt;">Códido-fonte</abbr></li>
        <li>  <abbr title="Use a tag &lt;ol&gt; &lt;/ol&gt; em conjunto com &lt;li&gt; &lt;/li&gt;">Listas numeradas</abbr></li>
        <li> <abbr title="Use a Taq &lt;mark&gt; &lt;/mark&gt;">Listas com demarcadores</abbr> </li>
        <li><abbr title="Hyper text markup language">HTML5</abbr></li>

    
    
   
    </ul>
